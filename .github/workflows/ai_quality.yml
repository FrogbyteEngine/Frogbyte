name: AI Quality

on:
  pull_request_target:
    types:
      - labeled

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

# Only one AI quality run may modify a PR branch at a time.
# queue: max keeps additional label-triggered runs pending instead of replacing
# them, so agent:tests, agent:docs and agent:benchmarks may be applied together.
concurrency:
  group: ai-quality-${{ github.event.pull_request.number }}
  queue: max
  cancel-in-progress: false

jobs:
  quality:
    name: ${{ github.event.label.name }}

    # The privileged workflow is intentionally limited to same-repository PRs.
    # Claude Code Action additionally checks that the triggering actor has write
    # access to the repository.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        github.event.label.name == 'agent:tests' ||
        github.event.label.name == 'agent:docs' ||
        github.event.label.name == 'agent:benchmarks'
      )

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      QUALITY_TASK: ${{ github.event.label.name }}

    steps:
      - name: Check command label is still active
        id: command
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if gh api \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" \
            --paginate \
            --jq '.[].name' |
            grep -Fxq "$QUALITY_TASK"; then
            echo "active=true" >> "$GITHUB_OUTPUT"
          else
            echo "active=false" >> "$GITHUB_OUTPUT"
          fi

      # pull_request_target is privileged. Keep only trusted base-branch content
      # in the workspace root. Never check out or execute the PR head here.
      - name: Check out trusted base branch
        if: steps.command.outputs.active == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Capture pull request head before Claude
        id: before
        if: steps.command.outputs.active == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.head.sha'
          )"

          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Run Claude quality agent
        id: claude
        if: steps.command.outputs.active == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@6b082c41935b4c8a3b8b0ef85ba4ba4d9eeb8975 # v1.0.189
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          prompt: |
            You are the Frogbyte quality-generation agent.

            Repository: ${{ github.repository }}
            Pull request: #${{ github.event.pull_request.number }}
            Triggering label: ${{ github.event.label.name }}

            Read the trusted base-branch CLAUDE.md before doing anything and
            obey it strictly.

            Read the pull request description, linked issue, changed files,
            relevant implementation, existing tests, documentation, and
            benchmarks using the allowed GitHub read-only commands.

            IMPORTANT SECURITY BOUNDARY:

            This workflow contains authentication credentials.

            Never execute pull-request-controlled project code in this job.
            Do not run Cargo, build scripts, tests, benchmarks, formatters,
            linters, documentation builds, project scripts, binaries, proc
            macros, or any other command derived from pull-request contents.

            Existing GitHub CI is responsible for deterministic validation
            after your changes are pushed.

            Perform exactly ONE task:

            - `agent:tests`:
              Generate or improve meaningful integration tests for behavior
              introduced or modified by this pull request.
              You may modify ONLY `crates/*/tests/**`.
              If useful testing requires editing production source or adding a
              dependency, make no change and explain why.

            - `agent:docs`:
              Generate or improve meaningful Rustdoc and documentation relevant
              to this pull request.
              You may modify ONLY:
              - `docs/**`;
              - `crates/*/README.md`;
              - Rust source under `crates/*/src/**/*.rs`, and only for Rustdoc
                or explanatory comments.
              Executable behavior must not change.

            - `agent:benchmarks`:
              Generate or improve realistic benchmarks relevant to this pull
              request.
              You may modify ONLY `crates/*/benches/**`.
              If no suitable benchmark harness already exists, make no code
              changes and report that the task was skipped.

            Never approve, submit a formal pull request review, merge, enable
            auto-merge, mark ready for review, or alter the merge state of this
            pull request.

            Never modify `.github/**`, `AGENTS.md`, `CLAUDE.md`, Cargo
            manifests, `Cargo.lock`, or `rust-toolchain.toml`.

            Do not add dependencies.
            Do not introduce unsafe code.
            Do not weaken tests, assertions, lint rules, safety checks, or
            validation.
            Do not make unrelated production changes.

            Before finishing, inspect your complete diff and verify that every
            changed path belongs to the triggering task.

            If useful changes were made, create at most one focused commit and
            push it only to the current pull request branch.

            After completing the task, post exactly one top-level pull request
            comment using `gh pr comment`.

            The report must contain:

            - the triggering command;
            - files added or modified, or `none`;
            - local validation: `not run in privileged AI job`;
            - CI validation: `pending after push`, or `not applicable` when no
              files were changed;
            - anything intentionally skipped and why.

            If no useful change was justified, report that clearly instead.

            Do not submit a formal pull request review. Do not approve the pull
            request.

          claude_args: |
            --max-turns 20
            --allowedTools "Read,Glob,Grep,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh pr comment:*)"
            --disallowedTools "Bash(cargo:*),Bash(git commit --no-verify:*),Bash(git push --no-verify:*),Bash(git push --force:*),Bash(git push --force-with-lease:*),Bash(git rebase:*),Bash(git reset:*),Bash(gh pr review:*),Bash(gh pr merge:*)"

      # Claude Code Action can push directly to an open PR branch. Audit the
      # actual pushed commit range through the GitHub API without checking out
      # or executing PR-controlled code.
      - name: Audit generated file scope
        id: scope
        if: >-
          always() &&
          steps.command.outputs.active == 'true' &&
          steps.claude.outcome == 'success' &&
          steps.before.outputs.sha != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ steps.before.outputs.sha }}
          TASK_LABEL: ${{ github.event.label.name }}
        run: |
          set -euo pipefail

          echo "valid=true" >> "$GITHUB_OUTPUT"

          after_sha="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.head.sha'
          )"

          test -n "$after_sha"

          if [[ "$after_sha" == "$BEFORE_SHA" ]]; then
            echo "No commit was pushed by the AI task."
            exit 0
          fi

          mapfile -t files < <(
            gh api \
              "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${after_sha}" \
              --paginate \
              --jq '.files[].filename'
          )

          fail=0

          for file in "${files[@]}"; do
            case "$TASK_LABEL" in
              agent:tests)
                if [[ "$file" =~ ^crates/[^/]+/tests/ ]]; then
                  continue
                fi
                ;;

              agent:docs)
                if [[ "$file" =~ ^docs/ ]] ||
                   [[ "$file" =~ ^crates/[^/]+/README\.md$ ]] ||
                   [[ "$file" =~ ^crates/[^/]+/src/.*\.rs$ ]]; then
                  continue
                fi
                ;;

              agent:benchmarks)
                if [[ "$file" =~ ^crates/[^/]+/benches/ ]]; then
                  continue
                fi
                ;;

              *)
                echo "::error::Unknown AI quality task: $TASK_LABEL"
                fail=1
                continue
                ;;
            esac

            echo "::error::$TASK_LABEL pushed an out-of-scope file: $file"
            fail=1
          done

          if [[ "$fail" -ne 0 ]]; then
            echo "valid=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Detect Claude subscription limit
        id: claude_limit
        if: always() && steps.command.outputs.active == 'true'
        shell: bash
        env:
          CLAUDE_STEP_OUTCOME: ${{ steps.claude.outcome }}
          CLAUDE_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          set -euo pipefail

          echo "reached=false" >> "$GITHUB_OUTPUT"
          echo "failed=false" >> "$GITHUB_OUTPUT"

          if [[ "$CLAUDE_STEP_OUTCOME" != "success" ||
                "$CLAUDE_CONCLUSION" == "failure" ]]; then
            echo "failed=true" >> "$GITHUB_OUTPUT"
          else
            exit 0
          fi

          # Only match messages that specifically describe included usage
          # exhaustion. Generic rate-limit errors may be transient throttling
          # and must not automatically consume the Codex fallback.
          if [[ -z "$EXECUTION_FILE" || ! -f "$EXECUTION_FILE" ]]; then
            exit 0
          fi

          if grep -Eqi \
            'usage limit|limit reached|5-hour limit|weekly limit|exceed.*usage' \
            "$EXECUTION_FILE"; then
            echo "reached=true" >> "$GITHUB_OUTPUT"
          fi

      # Codex runs asynchronously after the @codex comment is posted. Clear all
      # currently queued command labels first so older label events become
      # no-ops when their runs leave the GitHub concurrency queue.
      - name: Clear queued command labels before Codex fallback
        if: steps.claude_limit.outputs.reached == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          for label in agent:tests agent:docs agent:benchmarks; do
            gh api \
              --method DELETE \
              "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${label}" \
              >/dev/null 2>&1 || true
          done

      - name: Trigger Codex fallback
        if: steps.claude_limit.outputs.reached == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CODEX_FALLBACK_PAT }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TASK_LABEL: ${{ github.event.label.name }}
        run: |
          set -euo pipefail

          case "$TASK_LABEL" in
            agent:tests)
              TASK="Generate or improve meaningful integration tests for this pull request. Modify only crates/*/tests/**. Do not change production behavior."
              ;;
            agent:docs)
              TASK="Generate or improve meaningful Rustdoc and documentation for this pull request. Do not change executable behavior."
              ;;
            agent:benchmarks)
              TASK="Generate or improve realistic benchmarks for this pull request. Modify only crates/*/benches/**. If no benchmark harness exists, make no code changes and explain why."
              ;;
            *)
              exit 1
              ;;
          esac

          BODY="@codex FROGBYTE_QUALITY_FALLBACK

          Claude could not continue because its included usage limit appears to have been reached.

          Other queued AI quality command labels were cleared before starting
          this fallback to avoid concurrent writers. They can be applied again
          after this Codex task has completed.

          $TASK

          Follow the explicit quality-generation fallback rules in AGENTS.md.

          Never approve, submit an approving review, merge, enable auto-merge,
          mark ready for review, or change the merge state of this PR.

          Do not modify CI, GitHub workflows, CLAUDE.md, Cargo manifests,
          Cargo.lock, or rust-toolchain.toml. Do not add dependencies.

          Run the relevant Rust validation in the Codex environment. Commit and
          push only useful quality changes to this PR branch."

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="$BODY"

      - name: Report non-quota Claude failure
        if: >-
          always() &&
          steps.command.outputs.active == 'true' &&
          steps.claude_limit.outputs.failed == 'true' &&
          steps.claude_limit.outputs.reached != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TASK_LABEL: ${{ github.event.label.name }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="Claude failed while processing \`${TASK_LABEL}\`, but the failure was not confidently identified as an included-usage quota limit. Codex fallback was intentionally not triggered. Check the AI Quality workflow run."

      - name: Report scope violation
        if: always() && steps.scope.outputs.valid == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TASK_LABEL: ${{ github.event.label.name }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="The \`${TASK_LABEL}\` AI task pushed at least one file outside its allowed path scope. The AI Quality run failed. Do not merge those generated changes until they are reviewed and corrected."

      # A command label is reusable after the previous invocation has removed
      # it. Do not remove and re-apply the same label while its current run is
      # still active.
      - name: Remove command label
        if: always() && steps.command.outputs.active == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TASK_LABEL: ${{ github.event.label.name }}
        run: |
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${TASK_LABEL}" \
            >/dev/null 2>&1 || true

      - name: Fail workflow when Claude failed without fallback
        if: >-
          always() &&
          steps.command.outputs.active == 'true' &&
          steps.claude_limit.outputs.failed == 'true' &&
          steps.claude_limit.outputs.reached != 'true'
        shell: bash
        run: exit 1
